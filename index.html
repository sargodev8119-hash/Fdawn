<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>FDown</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d18;color:#f4f6ff;font-family:Arial,sans-serif;min-height:100vh}
header{padding:23px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #20283a}
.logo{font-size:23px;font-weight:800;letter-spacing:1px}
.logo span{color:#4f8cff}
.tag{color:#8e9ab2;font-size:12px}
main{max-width:480px;margin:auto;padding:30px 20px}
.hero{text-align:center;margin:30px 0}
.icon{width:75px;height:75px;margin:auto;border-radius:23px;background:linear-gradient(145deg,#1d65e9,#1441a4);display:grid;place-items:center;font-size:32px}
h1{font-size:27px;margin:22px 0 10px}
.subtitle{color:#8c98ad;line-height:1.6;font-size:14px}
.card{background:#111827;border:1px solid #232e43;border-radius:20px;padding:18px;margin-top:28px}
.label{font-size:13px;color:#a8b4c9;margin-bottom:12px}
textarea{width:100%;height:110px;resize:none;border:1px solid #263248;background:#0a101e;color:white;border-radius:13px;padding:14px;outline:none;font-size:14px;line-height:1.5}
textarea:focus{border-color:#4382f5}
.buttons{display:flex;gap:10px;margin-top:12px}
button{border:0;border-radius:12px;padding:14px;color:white;font-weight:700;cursor:pointer}
.clear{background:#202a3a}
.download{flex:1;background:linear-gradient(90deg,#2870f5,#1751c4)}
.status{display:none;margin-top:15px;padding:12px;border-radius:12px;font-size:13px;line-height:1.5;background:#182438;color:#b9cae8;overflow-wrap:anywhere}
.status.show{display:block}
.info{margin-top:22px;color:#8997ad;font-size:12px;line-height:1.7;text-align:center}
footer{text-align:center;padding:20px;color:#647087;font-size:11px}
</style>
</head>
<body>
<header>
 <div class="logo">F<span>Down</span></div>
 <div class="tag">PERSONAL • NO ADS</div>
</header>
<main>
 <div class="hero">
  <div class="icon">⬇</div>
  <h1>ভিডিও ডাউনলোড</h1>
  <div class="subtitle">অনুমোদিত সরাসরি ভিডিও ফাইলের লিংক ব্যবহার করো।</div>
 </div>
 <div class="card">
  <div class="label">ভিডিও লিংক</div>
  <textarea id="url" placeholder="সরাসরি ভিডিও ফাইলের URL পেস্ট করো..."></textarea>
  <div class="buttons">
   <button class="clear" onclick="clearLink()">Clear</button>
   <button class="download" onclick="downloadVideo()">⬇ Download Video</button>
  </div>
  <div class="status" id="status"></div>
 </div>
 <div class="info">
  শুধুমাত্র নিজের বা ডাউনলোডের অনুমতি থাকা ভিডিও ব্যবহার করো।
  সব সাইটের লিংক কাজ নাও করতে পারে।
 </div>
</main>
<footer>FDown • Personal video downloader</footer>
<script>
const urlBox=document.getElementById("url");
const statusBox=document.getElementById("status");

function clearLink(){
 urlBox.value="";
 statusBox.className="status";
 statusBox.textContent="";
}

function showStatus(text){
 statusBox.textContent=text;
 statusBox.className="status show";
}

function downloadVideo(){
 const url=urlBox.value.trim();
 if(!url){
  showStatus("আগে ভিডিও লিংক পেস্ট করো।");
  return;
 }

 let parsed;
 try{parsed=new URL(url);}catch(e){
  showStatus("সঠিক লিংক দাও।");
  return;
 }

 if(parsed.protocol!=="https:" && parsed.protocol!=="http:"){
  showStatus("HTTP বা HTTPS ভিডিও লিংক ব্যবহার করো।");
  return;
 }

 // This works best with direct media file URLs.
 const a=document.createElement("a");
 a.href=parsed.href;
 a.download="video";
 a.target="_blank";
 a.rel="noopener";
 document.body.appendChild(a);
 a.click();
 a.remove();

 showStatus("লিংক খোলা হয়েছে। যদি ভিডিও প্লে হয়, ব্রাউজারের মেনু থেকে Download ব্যবহার করো।");
}
</script>
</body>
</html>
